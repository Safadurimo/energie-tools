<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLP-Rechner &mdash; Energie-Tools</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <div class="site-header__brand"><a href="../index.html">Energie-Tools</a></div>
      <nav>
        <a href="../index.html">Übersicht</a>
      </nav>
    </div>
  </header>

  <main>
    <p class="breadcrumb"><a href="../index.html">Tools</a> / SLP-Rechner</p>

    <h1 class="page-title">SLP-Rechner</h1>
    <p class="page-subtitle">Berechnung des h-Werts der BDEW-SigLinDe-Funktion (Sigmoid + linearer Term) für Gas-Standardlastprofile.</p>

    <div class="panel">
      <form id="slp-form">
        <div class="form-row">
          <label for="profile-select">SLP-Profil (Koeffizienten aus BDEW-Anlage 6 vorausfüllen)</label>
          <select id="profile-select">
            <option value="">— manuell eingeben —</option>
          </select>
        </div>
        <div class="form-row">
          <label for="param-a">Parameter A</label>
          <input type="number" id="param-a" step="any" required>
        </div>
        <div class="form-row">
          <label for="param-b">Parameter B</label>
          <input type="number" id="param-b" step="any" required>
        </div>
        <div class="form-row">
          <label for="param-c">Parameter C</label>
          <input type="number" id="param-c" step="any" required>
        </div>
        <div class="form-row">
          <label for="param-d">Parameter D</label>
          <input type="number" id="param-d" step="any" required>
        </div>
        <div class="form-row">
          <label for="param-mh">Parameter mH (Heizgas-Gerade, Steigung)</label>
          <input type="number" id="param-mh" step="any" required>
        </div>
        <div class="form-row">
          <label for="param-bh">Parameter bH (Heizgas-Gerade, Achsenabschnitt)</label>
          <input type="number" id="param-bh" step="any" required>
        </div>
        <div class="form-row">
          <label for="param-mw">Parameter mW (Warmwasser-Gerade, Steigung)</label>
          <input type="number" id="param-mw" step="any" required>
        </div>
        <div class="form-row">
          <label for="param-bw">Parameter bW (Warmwasser-Gerade, Achsenabschnitt)</label>
          <input type="number" id="param-bw" step="any" required>
        </div>
        <div class="form-row">
          <label for="temperatur">Temperatur θ (°C)</label>
          <input type="number" id="temperatur" step="any" required>
        </div>
        <button type="submit">Berechnen</button>
      </form>

      <div id="result" class="form-row" style="margin-top: 1.5rem;"></div>
    </div>
  </main>

  <footer class="site-footer">
    Energie-Tools &mdash; statisch, ohne Backend.
  </footer>

  <script src="../assets/js/slp-profile.js"></script>
  <script src="../assets/js/slp-rechner.js"></script>
</body>
</html>
